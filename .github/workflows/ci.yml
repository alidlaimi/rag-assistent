name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Neuer Push auf denselben Branch bricht ältere, noch laufende Läufe ab
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    env:
      PROTOKOLL_SALT: ci-test-salt   # Testwert; echte Geheimnisse gibt es in der CI nicht
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: PyTorch (CPU-Variante, klein)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Projekt installieren
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q

  geheimnisse:
    name: Geheimnis-Prüfung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0            # ganze Historie: auch alte Commits werden geprüft
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    name: Docker-Images
    needs: [tests, geheimnisse]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write               # zum Veröffentlichen in der GitHub Container Registry
    env:
      VEROEFFENTLICHEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Anmelden bei ghcr.io (nur main)
        if: env.VEROEFFENTLICHEN == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API-Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.VEROEFFENTLICHEN == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/rag-assistent-api:latest
            ghcr.io/${{ github.repository_owner }}/rag-assistent-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: UI-Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ui/Dockerfile
          push: ${{ env.VEROEFFENTLICHEN == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/rag-assistent-ui:latest
            ghcr.io/${{ github.repository_owner }}/rag-assistent-ui:${{ github.sha }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
