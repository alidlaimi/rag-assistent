[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-assistent"
version = "0.1.0"
description = "RAG-Assistent mit Agent-Funktionen für Verwaltungsdokumente"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  "pypdf>=5.0",
  "numpy>=1.26",
  "pgvector>=0.3",
  "sentence-transformers>=3.0",
  "anthropic>=0.40",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "streamlit>=1.40",
  "requests>=2.31",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
