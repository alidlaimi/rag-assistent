# Testset für den RAG-Assistenten
#
# Jede Erwartung ist im Originaltext belegt (Dokument-ID aus data/sources.csv + Seite).
# Felder:
#   kategorie   fakt | frist | rueckfrage | nicht_in_dokumenten | ausserhalb
#   quellen     akzeptierte Fundstellen (eine davon muss gefunden bzw. zitiert werden)
#   muss        Regex (ohne Gross-/Kleinschreibung), die alle in der Antwort vorkommen müssen
#   darf_nicht  Regex, die nicht vorkommen dürfen (bekannte Fehlantworten)
#   werkzeug    Werkzeug, das der Agent aufrufen muss
#   kein_werkzeug  Werkzeug, das der Agent NICHT aufrufen darf
#   personendaten  Arten von Personendaten, die vor dem Modellaufruf entfernt werden müssen

# ---------------- Fakten: ZHdK Rahmenordnung (RO) ----------------
- id: ro-bachelor-hoechstdauer
  kategorie: fakt
  frage: Wie viele Semester darf ein Bachelorstudium an der ZHdK höchstens dauern?
  quellen: [{dok: zhdk-ro, seite: 2}, {dok: zhdk-aso, seite: 3}]
  muss: ["(10|zehn) Semester"]
  darf_nicht: ["keine (generelle|verbindliche|allgemeine) Höchst"]
  notiz: Bekannter schwieriger Fall aus Meilenstein 3 (RO S. 2 wurde nicht gefunden).

- id: ro-master-hoechstdauer
  kategorie: fakt
  frage: Wie lange darf ein Masterstudium an der ZHdK höchstens dauern?
  quellen: [{dok: zhdk-ro, seite: 2}]
  muss: ["(8|acht) Semester"]

- id: ro-rekursfrist
  kategorie: fakt
  frage: Innert welcher Frist kann ich gegen einen Entscheid der ZHdK Rekurs einlegen?
  quellen: [{dok: zhdk-ro, seite: 15}, {dok: zh-vrg, seite: 10}]
  muss: ["30 Tage"]

- id: ro-einsprache-zulassung
  kategorie: fakt
  frage: Was kann ich tun, wenn ich mit einem Zulassungsentscheid der ZHdK nicht einverstanden bin?
  quellen: [{dok: zhdk-ro, seite: 15}]
  muss: ["Einsprache", "Departementsleitung", "30 Tage"]

- id: ro-urlaub-dauer
  kategorie: fakt
  frage: Wie lange kann ich an der ZHdK Urlaub vom Studium nehmen?
  quellen: [{dok: zhdk-ro, seite: 11}]
  muss: ["zwei Semester"]

- id: ro-urlaub-gebuehren
  kategorie: fakt
  frage: Muss ich während eines Urlaubssemesters an der ZHdK Studiengebühren bezahlen?
  quellen: [{dok: zhdk-ro, seite: 11}]
  muss: ["befreit"]

- id: ro-unterbruch
  kategorie: fakt
  frage: Werden meine Studienleistungen angerechnet, wenn ich das Studium an der ZHdK unterbreche und später wieder einsteige?
  quellen: [{dok: zhdk-ro, seite: 11}]
  muss: ["vier"]

- id: ro-credits-semester
  kategorie: fakt
  frage: Für wie viele Credits kann ich mich pro Semester höchstens einschreiben?
  quellen: [{dok: zhdk-ro, seite: 5}]
  muss: ["36"]

- id: ro-wiederholung
  kategorie: fakt
  frage: Wie oft darf ich ein nicht bestandenes Pflichtmodul wiederholen?
  quellen: [{dok: zhdk-ro, seite: 10}]
  muss: ["einmal"]

- id: ro-minor-beginn
  kategorie: fakt
  frage: Ab welchem Semester kann ich im Bachelorstudium ein Minor belegen?
  quellen: [{dok: zhdk-ro, seite: 3}]
  muss: ["dritten"]

