name: E2E gegen das echte Modell

# Nur von Hand startbar: GitHub -> Actions -> "E2E gegen das echte Modell" -> "Run workflow".
# Kostet pro Lauf wenige Rappen (vier Fragen mit Modellaufruf; zwei Fragen erreichen das
# Modell bewusst nicht). Braucht das Repository-Secret ANTHROPIC_API_KEY.
#
# Warum zusätzlich zum Testmodus? Der Testmodus prüft das System um das Modell herum –
# deterministisch und gratis. Dieser Lauf prüft, was nur ein echtes Modell zeigen kann:
# ob es den Fristenrechner selbst aufruft, korrekt zitiert und der Prompt-Injection widersteht.
on:
  workflow_dispatch:
    inputs:
      modell:
        description: "Claude-Modell"
        default: claude-sonnet-5-5
        type: choice
        options:
          - claude-sonnet-5-5
          - claude-haiku-5-5

permissions:
  contents: read

jobs:
  e2e-echt:
    name: E2E (echtes Modell)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: ci-nur-fuer-tests   # Wegwerf-Datenbank, existiert nur in diesem Lauf
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ci-nur-fuer-tests
      POSTGRES_DB: rag
      E2E_ECHTES_MODELL: "1"
      CLAUDE_MODEL: ${{ inputs.modell }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # in Logs automatisch maskiert
    steps:
      - name: Secret vorhanden?
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Repository-Secret ANTHROPIC_API_KEY fehlt (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: PyTorch (CPU-Variante, klein)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Projekt mit E2E-Werkzeugen installieren
        run: pip install -e ".[dev,e2e]"
      - name: Embedding-Modell aus dem Cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small-v1
      - name: Browser für Playwright
        run: python -m playwright install --with-deps chromium
      # Trace, Video und Screenshot für JEDEN Test – auch bei Erfolg (zum Nachvollziehen und Zeigen)
      - name: E2E-Tests
        run: >-
          pytest -m e2e -v
          --output test-results
          --screenshot on
          --video on
          --tracing on
      - name: Artefakte hochladen
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-echtes-modell-${{ github.run_number }}
          path: |
            test-results/
            test-logs/
          retention-days: 30
