[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-assistent"
version = "0.1.0"
description = "RAG-Assistent mit Agent-Funktionen für Verwaltungsdokumente"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  "pypdf>=5.0",
  "numpy>=1.26",
  "pgvector>=0.3",
  "sentence-transformers>=3.0",
  "anthropic>=0.40",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "streamlit>=1.40",
  "requests>=2.31",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# End-to-End-Tests im Browser; Browser danach einmalig: playwright install chromium
e2e = ["pytest-playwright>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# E2E-Tests brauchen Browser und laufende Server: Ein normales `pytest` lässt sie aus,
# `pytest -m e2e` führt nur sie aus (das letzte -m auf der Kommandozeile gilt).
addopts = "-m 'not e2e'"
markers = ["e2e: End-to-End-Test im Browser (Playwright)"]
