# Entwicklung (nur Datenbank):      docker compose up -d
# Ganze Anwendung in Containern:    docker compose --profile app up -d --build
services:
  db:
    # Offizielles PostgreSQL-Image mit vorinstallierter pgvector-Erweiterung
    image: pgvector/pgvector:pg17
    container_name: rag-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Daten überleben einen Neustart des Containers
      - pgdata:/var/lib/postgresql/data
      # Wird nur beim allerersten Start (leeres Volume) ausgeführt
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build: .
    image: rag-assistent-api
    env_file: .env                 # API-Schlüssel und Salt kommen zur Laufzeit, nie ins Image
    environment:
      POSTGRES_HOST: db            # im Container-Netz heisst die Datenbank "db"
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data/raw:/app/data/raw:ro   # PDFs für scripts/ingest.py

  ui:
    profiles: ["app"]
    build:
      context: .
      dockerfile: ui/Dockerfile
    image: rag-assistent-ui
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"

volumes:
  pgdata:
